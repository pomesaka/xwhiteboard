<!doctype html>
<html lang="ja" data-theme="xwb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xwb</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main id="stage">
      <div id="world">
        <div id="els"></div>
        <svg id="lines" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="claims"></div>
        <div id="handle" class="handle" hidden></div>
      </div>
      <div id="marquee" hidden></div>
    </main>
    <!-- 上の段。題名・選択バー・表示の操作を 1 つの行に並べる。
         WHY 1 つの行: 選択バーを画面の中央に固定すると、ボタンが多いときに右の表示の操作へ重なる。
         行に並べて、入りきらない選択バーは間で折り返す。空いた場所はボードを操作できるように、行そのものは押せなくする -->
    <div class="pointer-events-none fixed inset-x-3 top-3 z-10 flex items-start justify-between gap-3">
      <!-- 左の列。題名の下に、注目の札を置く。WHY 行の中の列にする: 札を画面に固定すると、折り返した選択バーに重なる -->
      <div class="flex max-w-1/3 flex-none flex-col items-start gap-2">
        <header id="top" class="chrome-bar pointer-events-auto max-w-full gap-2 py-2 pr-4 pl-3">
          <span id="conn" class="size-2 flex-none rounded-full bg-destructive"></span>
          <div id="title" class="min-h-5 min-w-16 truncate text-action font-bold outline-none"></div>
        </header>
        <div id="focus" class="chrome-bar pointer-events-auto max-w-full gap-1 py-1 pr-1 pl-3" hidden>
          <span id="focusname" class="min-w-0 truncate font-bold"></span>
          <button id="unfocus" class="chrome-button flex-none" title="注目をやめる（開いている全部の画面で）">解除</button>
        </div>
      </div>
      <div id="bar" class="chrome-bar pointer-events-auto mx-auto min-w-0 flex-wrap justify-center gap-x-4 gap-y-1 px-2 py-1" hidden></div>
      <div id="view" class="chrome-bar pointer-events-auto flex-none gap-1 p-1">
      <button id="resolved" class="chrome-button" title="解決済みのコメントを表示" aria-pressed="false" hidden></button>
      <button id="undo" class="chrome-button" title="元に戻す（⌘Z）">戻す</button>
      <button id="zoomout" class="chrome-button" title="縮小">−</button>
      <span id="zoom" class="w-12 text-center tabular-nums">100%</span>
      <button id="zoomin" class="chrome-button" title="拡大">＋</button>
      <button id="fit" class="chrome-button" title="全体を表示">全体</button>
        <button id="png" class="chrome-button" title="ボード全体を PNG で保存">PNG</button>
      </div>
    </div>
    <nav id="tools" class="chrome-bar fixed z-10 top-1/2 left-3 -translate-y-1/2 flex-col gap-1 p-1" aria-label="道具">
      <button class="chrome-button" data-tool="select" title="選択（V）">選択</button>
      <button class="chrome-button" data-tool="note" title="付箋（N）">付箋</button>
      <button class="chrome-button" data-tool="shape" title="図形（R）">図形</button>
      <button class="chrome-button" data-tool="text" title="文字（T）">文字</button>
      <button class="chrome-button" data-tool="container" title="セクション（S）">枠</button>
      <button class="chrome-button" data-tool="table" title="表">表</button>
      <button class="chrome-button" data-tool="arrow" title="矢印（A）">矢印</button>
      <button class="chrome-button" data-tool="pen" title="ペン（P）">ペン</button>
      <button class="chrome-button" data-tool="comment" title="コメント（C）。ドラッグで範囲、クリックで 1 点">コメント</button>
    </nav>
    <div id="toast" class="fixed bottom-6 left-1/2 z-20 max-w-2/3 -translate-x-1/2 flex items-center gap-3 rounded-card bg-destructive py-2 pr-2 pl-4 text-caption text-destructive-foreground shadow-lg" role="alert" hidden></div>
    <script src="/app.js"></script>
  </body>
</html>
